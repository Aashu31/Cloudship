services:
  database:
    image: postgres:18-alpine
    container_name: cloudship-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cloudship_dev}
      POSTGRES_USER: ${DB_USERNAME:-cloudship}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloudship_dev_password}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - cloudship-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cloudship} -d ${DB_NAME:-cloudship_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cloudship-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cloudship/backend:1.0.0
    container_name: cloudship-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      SERVER_PORT: 8088
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cloudship_dev}
      DB_USERNAME: ${DB_USERNAME:-cloudship}
      DB_PASSWORD: ${DB_PASSWORD:-cloudship_dev_password}
      SPRING_PROFILES_ACTIVE: dev
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8088
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8088/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - cloudship-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: cloudship/frontend:1.0.0
    container_name: cloudship-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - cloudship-network

volumes:
  cloudship-pgdata:
    name: cloudship-pgdata

networks:
  cloudship-network:
    name: cloudship-network
    driver: bridge
