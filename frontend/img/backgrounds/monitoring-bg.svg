<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <radialGradient id="mon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#07090E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mon-grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#10B981" stroke-opacity="0.02" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#07090E"/>
  <rect width="100%" height="100%" fill="url(#mon-glow)"/>
  <rect width="100%" height="100%" fill="url(#mon-grid)"/>

  <!-- Telemetry Signal Sine Waveforms & EKG Pulses -->
  <g opacity="0.3" stroke="#10B981" stroke-width="1.5" fill="none">
    <!-- Heartbeat signal 1 -->
    <path d="M 100 520 L 500 520 L 530 460 L 560 590 L 590 500 L 620 540 L 640 520 L 1100 520 L 1130 460 L 1160 590 L 1190 500 L 1220 540 L 1240 520 L 1800 520"/>
    <!-- Signal 2 (high frequency) -->
    <path d="M 100 700 C 250 660, 350 740, 500 700 C 650 660, 750 740, 900 700 C 1050 660, 1150 740, 1300 700 C 1450 660, 1550 740, 1700 700" stroke-opacity="0.5"/>
  </g>

  <!-- Telemetry Metrics Annotations -->
  <g font-family="monospace" font-size="10" fill="#34D399" opacity="0.35">
    <text x="120" y="495">HTTP_STATUS: 200_OK // RTT: 12MS</text>
    <text x="660" y="495">POSTGRESQL_CONNECTION_POOL: 10/10 ACTIVE</text>
    <text x="1260" y="495">CPU_UTILIZATION: 4.2% // MEMORY: 312MB</text>
    <text x="120" y="735">OBSERVABILITY_DAEMON: NOMINAL // 0 ACTIVE_ALERTS</text>
  </g>
</svg>
