<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <radialGradient id="jenk-glow" cx="75%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#07090E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="#07090E"/>
  <rect width="100%" height="100%" fill="url(#jenk-glow)"/>

  <!-- CI Stage Track Progression -->
  <g opacity="0.3" stroke="#F59E0B" stroke-width="1.5">
    <line x1="200" y1="420" x2="1600" y2="420" stroke-dasharray="6 6"/>
    <!-- Stage checkpoints -->
    <rect x="340" y="390" width="60" height="60" rx="6" fill="#0D111A" stroke="#F59E0B"/>
    <rect x="640" y="390" width="60" height="60" rx="6" fill="#0D111A" stroke="#F59E0B"/>
    <rect x="940" y="390" width="60" height="60" rx="6" fill="#0D111A" stroke="#F59E0B"/>
    <rect x="1240" y="390" width="60" height="60" rx="6" fill="#0D111A" stroke="#F59E0B"/>
  </g>

  <!-- Progress Indicators -->
  <g fill="#FBBF24" opacity="0.5">
    <circle cx="370" cy="420" r="4"/>
    <circle cx="670" cy="420" r="4"/>
    <circle cx="970" cy="420" r="4"/>
    <circle cx="1270" cy="420" r="4"/>
  </g>

  <g font-family="monospace" font-size="10" fill="#F59E0B" opacity="0.3">
    <text x="325" y="480">STAGE 01: CHECKOUT</text>
    <text x="625" y="480">STAGE 02: MAVEN TEST</text>
    <text x="925" y="480">STAGE 03: DOCKER BUILD</text>
    <text x="1225" y="480">STAGE 04: ACR PUBLISH</text>
  </g>
</svg>
