<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <radialGradient id="main-glow-1" cx="30%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#07090E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="main-glow-2" cx="80%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#07090E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-pattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FFFFFF" stroke-opacity="0.018" stroke-width="1"/>
      <circle cx="60" cy="60" r="1" fill="#38BDF8" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Ambient Glow Layers -->
  <rect width="100%" height="100%" fill="#07090E"/>
  <rect width="100%" height="100%" fill="url(#main-glow-1)"/>
  <rect width="100%" height="100%" fill="url(#main-glow-2)"/>
  <rect width="100%" height="100%" fill="url(#grid-pattern)"/>

  <!-- Topological Infrastructure Vector Lines -->
  <g opacity="0.35" stroke="#0284C7" stroke-width="1" stroke-dasharray="4 6">
    <path d="M 120 180 L 480 180 L 640 340 L 1120 340 L 1280 180 L 1800 180"/>
    <path d="M 120 620 L 400 620 L 580 800 L 1340 800 L 1520 620 L 1800 620"/>
    <path d="M 640 340 L 640 740 L 780 880"/>
    <path d="M 1280 180 L 1280 620"/>
  </g>

  <!-- Key Routing Nodes -->
  <g fill="#38BDF8" opacity="0.4">
    <circle cx="480" cy="180" r="3"/>
    <circle cx="640" cy="340" r="3"/>
    <circle cx="1120" cy="340" r="3"/>
    <circle cx="1280" cy="180" r="3"/>
    <circle cx="400" cy="620" r="3"/>
    <circle cx="580" cy="800" r="3"/>
    <circle cx="1340" cy="800" r="3"/>
    <circle cx="1520" cy="620" r="3"/>
  </g>

  <!-- Coordinates & Hash Watermarks -->
  <g font-family="monospace" font-size="9" fill="#94A3B8" opacity="0.15">
    <text x="140" y="165">REGION::EASTUS-2 // NODE_CLUSTER_01</text>
    <text x="1140" y="325">LATENCY_P99 &lt; 15MS</text>
    <text x="140" y="605">VNET_TOPOLOGY_0x7F</text>
    <text x="1360" y="785">AKS_INGRESS_BALANCER_ACTIVE</text>
  </g>
</svg>
