<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <radialGradient id="az-glow" cx="60%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0078D4" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#07090E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="#07090E"/>
  <rect width="100%" height="100%" fill="url(#az-glow)"/>

  <!-- VNet / Subnet Cloud Topology -->
  <g opacity="0.25" stroke="#0078D4" stroke-width="1.2">
    <!-- Resource Group Boundary -->
    <rect x="250" y="220" width="1420" height="640" rx="12" stroke-dasharray="8 6" fill="none"/>
    <!-- Virtual Network 10.0.0.0/16 -->
    <rect x="300" y="280" width="620" height="520" rx="8" fill="#0078D4" fill-opacity="0.02"/>
    <!-- Subnet 1 (AksSubnet 10.0.1.0/24) -->
    <rect x="340" y="340" width="540" height="200" rx="6" fill="#0078D4" fill-opacity="0.04"/>
    <!-- Subnet 2 (AppSubnet 10.0.2.0/24) -->
    <rect x="340" y="570" width="540" height="190" rx="6" fill="#0078D4" fill-opacity="0.04"/>
    <!-- ACR Container Registry Service Endpoint -->
    <rect x="1020" y="280" width="590" height="520" rx="8" fill="#0078D4" fill-opacity="0.02"/>
    <!-- Connection Gateway Line -->
    <path d="M 920 440 L 1020 440" stroke-width="2"/>
  </g>

  <g font-family="monospace" font-size="10" fill="#0078D4" opacity="0.35">
    <text x="270" y="250">RESOURCE_GROUP: rg-cloudship-dev // REGION: eastus</text>
    <text x="320" y="310">VIRTUAL_NETWORK: vnet-cloudship (10.0.0.0/16)</text>
    <text x="360" y="370">SUBNET: snet-cloudship-aks (10.0.1.0/24)</text>
    <text x="360" y="600">SUBNET: snet-cloudship-endpoints (10.0.2.0/24)</text>
    <text x="1040" y="310">MANAGED_RESOURCE: cloudshipcr.azurecr.io</text>
  </g>
</svg>
