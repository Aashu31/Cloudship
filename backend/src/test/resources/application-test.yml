spring:
  datasource:
    url: jdbc:h2:mem:cloudship_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  flyway:
    enabled: false

cloudship:
  security:
    cloudflare:
      enabled: false
      team-domain: ""
      aud: ""
      jwks-url: ""
      logout-url: ""
      dev-user-email: "dev@cloudship.local"
      dev-user-name: "CloudShip Dev Admin"
    headers:
      hsts:
        enabled: false
  auth:
    logout-url: ""

logging:
  level:
    root: INFO
    com.cloudship: DEBUG
