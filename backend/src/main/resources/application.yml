spring:
  application:
    name: cloudship-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${PORT:${SERVER_PORT:8088}}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

cloudship:
  version: ${APP_VERSION:8.0.0}
  security:
    cloudflare:
      enabled: ${CLOUDFLARE_ACCESS_ENABLED:false}
      team-domain: ${CLOUDFLARE_TEAM_DOMAIN:}
      aud: ${CLOUDFLARE_AUD_TAG:}
      jwks-url: ${CLOUDFLARE_JWKS_URL:}
      dev-user-email: ${CLOUDFLARE_DEV_USER_EMAIL:dev@cloudship.local}
      dev-user-name: ${CLOUDFLARE_DEV_USER_NAME:CloudShip Dev Admin}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8088,http://127.0.0.1:8088}
  jenkins:
    base-url: ${JENKINS_BASE_URL:http://localhost:8080}
    username: ${JENKINS_USERNAME:}
    api-token: ${JENKINS_API_TOKEN:}
    default-job-name: ${JENKINS_JOB_NAME:cloudship-ci}
    webhook-secret: ${JENKINS_WEBHOOK_SECRET:}
  azure:
    enabled: ${AZURE_ENABLED:false}
    subscription-id: ${AZURE_SUBSCRIPTION_ID:}
    tenant-id: ${AZURE_TENANT_ID:}
    client-id: ${AZURE_CLIENT_ID:}
    client-secret: ${AZURE_CLIENT_SECRET:}
    resource-group: ${AZURE_RESOURCE_GROUP:rg-cloudship-dev}
    location: ${AZURE_LOCATION:eastus}
    vnet-name: ${AZURE_VNET_NAME:vnet-cloudship}
    subnet-name: ${AZURE_SUBNET_NAME:snet-cloudship}
    acr-name: ${AZURE_ACR_NAME:cloudshipcr}
    acr-login-server: ${AZURE_ACR_LOGIN_SERVER:}
    acr-repository-prefix: ${AZURE_ACR_REPOSITORY_PREFIX:cloudship}
    aks-cluster-name: ${AZURE_AKS_CLUSTER_NAME:aks-cloudship-dev}
    aks-node-resource-group: ${AZURE_AKS_NODE_RESOURCE_GROUP:}
    k8s-namespace: ${K8S_NAMESPACE:default}
    k8s-kubeconfig-path: ${K8S_KUBECONFIG_PATH:}
    k8s-service-type: ${K8S_SERVICE_TYPE:ClusterIP}
