spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cloudship}?sslmode=${DB_SSL_MODE:require}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: CloudShipNeonHikariPool
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.cloudship: ${LOG_LEVEL_CLOUDSHIP:INFO}
    org.springframework.web: WARN
    org.hibernate: WARN

cloudship:
  security:
    headers:
      hsts:
        enabled: ${SECURITY_HEADERS_HSTS_ENABLED:true}
